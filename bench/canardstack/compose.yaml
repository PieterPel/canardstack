# Resource budget (2 CPUs / 3 GiB for the whole project) is applied at pod level by bench/run.py,
# so services share it without per-service CFS throttling.
# canardstack profile: external duckdb-otlp writer + DuckLake catalog + canardstack query server.
x-duckdb-otlp-image: &duckdb-otlp-image
  # 0.7.3 is the newest duckdb-otlp release built on DuckDB 1.5.x. The current
  # canardstack image bundles DuckDB 1.5.x and cannot read DuckLake metadata
  # written by the DuckDB 2.0 image (duckdb-otlp:latest).
  image: ${DUCKDB_OTLP_IMAGE}

services:
  # Prepare shared volumes, render the DuckLake attach SQL, and generate the
  # self-signed certificate that fronts Quack with TLS.
  init:
    image: docker.io/alpine/openssl:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        chmod -R 0777 /mnt/canardstack /mnt/catalog /mnt/data
        mkdir -p /certs /etc/duckdb-otlp
        if [ ! -s /certs/quack.crt ] || [ ! -s /certs/quack.key ]; then
          openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
            -subj "/CN=quack-tls" \
            -addext "subjectAltName=DNS:quack-tls,DNS:localhost,IP:127.0.0.1" \
            -keyout /certs/quack.key -out /certs/quack.crt
        fi
        case "$$QUACK_TOKEN" in
          *"'"*|*"|"*|*"&"*|*\\*)
            echo "QUACK_TOKEN must not contain quotes, pipes, ampersands, or backslashes" >&2
            exit 1
            ;;
        esac
        sed "s|__QUACK_TOKEN__|$$QUACK_TOKEN|g" \
          /templates/duckdb-otlp-ingest.sql > /etc/duckdb-otlp/ingest.sql
    environment:
      QUACK_TOKEN: ${QUACK_TOKEN:-dev-quack-token-123456}
    volumes:
      - canardstack-data:/mnt/canardstack
      - ducklake-catalog:/mnt/catalog
      - ducklake-data:/mnt/data
      - duckdb-init:/etc/duckdb-otlp
      - quack-certs:/certs
      - ../../config/compose/duckdb-otlp-ingest.sql:/templates/duckdb-otlp-ingest.sql:ro

  # A plain DuckDB database exposing Quack on an internal port. The TLS front
  # below terminates the self-signed connection that canardstack and ingest
  # expect for non-loopback Quack hosts.
  ducklake-catalog:
    <<: *duckdb-otlp-image
    depends_on:
      init:
        condition: service_completed_successfully
    command:
      - serve
      - --mode
      - none
      - --host
      - 0.0.0.0
      - --http
      - "4318"
      - --grpc
      - "0"
      - --quack
      - "9495"
      - --database
      - /var/lib/ducklake/catalog/catalog.duckdb
    environment:
      DUCKDB_OTLP_TOKEN: ${QUACK_TOKEN:-dev-quack-token-123456}
      DUCKDB_QUACK_TOKEN: ${QUACK_TOKEN:-dev-quack-token-123456}
    volumes:
      - ducklake-catalog:/var/lib/ducklake/catalog
    restart: unless-stopped

  quack-tls:
    image: docker.io/alpine/socat:latest
    depends_on:
      init:
        condition: service_completed_successfully
      ducklake-catalog:
        condition: service_started
    command:
      # nodelay on both legs: see ../../compose.yaml
      - OPENSSL-LISTEN:9494,bind=0.0.0.0,reuseaddr,fork,cert=/certs/quack.crt,key=/certs/quack.key,verify=0,nodelay
      - TCP:ducklake-catalog:9495,nodelay
    volumes:
      - quack-certs:/certs:ro
    restart: unless-stopped

  ingest:
    <<: *duckdb-otlp-image
    depends_on:
      init:
        condition: service_completed_successfully
      ducklake-catalog:
        condition: service_started
      quack-tls:
        condition: service_started
    ports:
      - "14338:4318"
    environment:
      DUCKDB_MODE: none
      DUCKDB_OTLP_INIT_SQL: /etc/duckdb-otlp/ingest.sql
      DUCKDB_CATALOG: canardlake
      DUCKDB_OTLP_HOST: 0.0.0.0
      DUCKDB_OTLP_HTTP_PORT: "4318"
      DUCKDB_OTLP_GRPC_PORT: "0"
      DUCKDB_OTLP_TOKEN: ${OTLP_TOKEN:-dev-otlp-token-123456}
    volumes:
      - ducklake-data:/var/lib/ducklake/data
      - duckdb-init:/etc/duckdb-otlp:ro
    healthcheck:
      test: ["CMD", "duckdb-otlp", "doctor", "--host", "127.0.0.1", "--http", "4318", "--grpc", "0"]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 24
    restart: unless-stopped

  canardstack:
    image: ${CANARDSTACK_IMAGE:-canardstack:local}
    # Match the ingest image's UID so both processes can write the shared
    # DuckLake data directory without fighting over ownership.
    user: "65532:65532"
    depends_on:
      init:
        condition: service_completed_successfully
      ducklake-catalog:
        condition: service_started
      quack-tls:
        condition: service_started
      ingest:
        condition: service_healthy
    ports:
      - "19091:9090"
    environment:
      CANARDSTACK_BIND: 0.0.0.0:9090
      CANARDSTACK_API_KEY: ${CANARDSTACK_API_KEY:-dev-canardstack-key}
      CANARDSTACK_ADMIN_API_KEY: ${CANARDSTACK_ADMIN_API_KEY:-dev-canardstack-admin-key}
      CANARDSTACK_DATA_DIR: /var/lib/canardstack
      CANARDSTACK_DUCKLAKE_ATTACH_URI: ${CANARDSTACK_DUCKLAKE_ATTACH_URI:-ducklake:quack:quack-tls:9494}
      CANARDSTACK_DUCKLAKE_DATA_PATH: ${CANARDSTACK_DUCKLAKE_DATA_PATH:-/var/lib/ducklake/data/}
      CANARDSTACK_DUCKLAKE_QUACK_TOKEN: ${QUACK_TOKEN:-dev-quack-token-123456}
      CANARDSTACK_DUCKLAKE_QUACK_INSECURE_TLS: "true"
      motherduck_token: ${motherduck_token:-}
    volumes:
      - canardstack-data:/var/lib/canardstack
      - ducklake-data:/var/lib/ducklake/data
    healthcheck:
      test: ["CMD", "canardstack", "healthcheck", "--endpoint", "http://127.0.0.1:9090/healthz"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 12
    restart: on-failure

volumes:
  canardstack-data:
  duckdb-init:
  ducklake-catalog:
  ducklake-data:
  quack-certs:
