# Grafana for the benchmark dashboards. It reads the stacks through their published host
# ports (host.containers.internal), so start it after the stacks you want to look at.
services:
  grafana:
    image: ${GRAFANA_IMAGE}
    ports: ["13030:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
      GF_USERS_DEFAULT_THEME: light
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/bench-results.json
      GF_PLUGINS_PREINSTALL_SYNC: victoriametrics-logs-datasource
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      GF_LOG_FILTERS: rendering:debug
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/etc/grafana/dashboards:ro
    depends_on: [renderer]
  renderer:
    image: ${GRAFANA_RENDERER_IMAGE}
    environment:
      ENABLE_METRICS: "false"
