apiVersion: 1

# Backends are reached through host-published ports, see bench/*/compose.yaml.
datasources:
  - name: Bench results (TestData)
    uid: testdata
    type: grafana-testdata-datasource

  # --- LGTM
  - name: LGTM Loki
    uid: lgtm-loki
    type: loki
    access: proxy
    url: http://host.containers.internal:13100
    jsonData: {maxLines: 1000}
  - name: LGTM Mimir
    uid: lgtm-mimir
    type: prometheus
    access: proxy
    url: http://host.containers.internal:19009/prometheus
    jsonData: {httpMethod: GET}
  - name: LGTM Tempo
    uid: lgtm-tempo
    type: tempo
    access: proxy
    url: http://host.containers.internal:13200

  # --- Victoria
  - name: VictoriaMetrics
    uid: victoria-metrics
    type: prometheus
    access: proxy
    url: http://host.containers.internal:18428
    jsonData: {httpMethod: GET}
  - name: VictoriaLogs
    uid: victoria-logs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://host.containers.internal:19428
  - name: VictoriaTraces (Jaeger API)
    uid: victoria-traces
    type: jaeger
    access: proxy
    url: http://host.containers.internal:10428/select/jaeger

  # --- canardstack (dev key from compose.yaml)
  - name: canardstack (Quack) Prometheus
    uid: canardstack-prometheus
    type: prometheus
    access: proxy
    url: http://host.containers.internal:19091
    jsonData: {httpMethod: GET, httpHeaderName1: Authorization}
    secureJsonData: {httpHeaderValue1: "Bearer dev-canardstack-key"}
  - name: canardstack (Quack) Loki
    uid: canardstack-loki
    type: loki
    access: proxy
    url: http://host.containers.internal:19091
    jsonData: {maxLines: 1000, httpHeaderName1: Authorization}
    secureJsonData: {httpHeaderValue1: "Bearer dev-canardstack-key"}
  - name: canardstack (Quack) Tempo
    uid: canardstack-tempo
    type: tempo
    access: proxy
    url: http://host.containers.internal:19091
    jsonData: {httpHeaderName1: Authorization}
    secureJsonData: {httpHeaderValue1: "Bearer dev-canardstack-key"}

  - name: canardstack (Postgres) Prometheus
    uid: canardstack-pg-prometheus
    type: prometheus
    access: proxy
    url: http://host.containers.internal:19092
    jsonData: {httpMethod: GET, httpHeaderName1: Authorization}
    secureJsonData: {httpHeaderValue1: "Bearer dev-canardstack-key"}
  - name: canardstack (Postgres) Loki
    uid: canardstack-pg-loki
    type: loki
    access: proxy
    url: http://host.containers.internal:19092
    jsonData: {maxLines: 1000, httpHeaderName1: Authorization}
    secureJsonData: {httpHeaderValue1: "Bearer dev-canardstack-key"}
  - name: canardstack (Postgres) Tempo
    uid: canardstack-pg-tempo
    type: tempo
    access: proxy
    url: http://host.containers.internal:19092
    jsonData: {httpHeaderName1: Authorization}
    secureJsonData: {httpHeaderValue1: "Bearer dev-canardstack-key"}

  - name: canardstack (SQLite) Prometheus
    uid: canardstack-sqlite-prometheus
    type: prometheus
    access: proxy
    url: http://host.containers.internal:19093
    jsonData: {httpMethod: GET, httpHeaderName1: Authorization}
    secureJsonData: {httpHeaderValue1: "Bearer dev-canardstack-key"}
  - name: canardstack (SQLite) Loki
    uid: canardstack-sqlite-loki
    type: loki
    access: proxy
    url: http://host.containers.internal:19093
    jsonData: {maxLines: 1000, httpHeaderName1: Authorization}
    secureJsonData: {httpHeaderValue1: "Bearer dev-canardstack-key"}
  - name: canardstack (SQLite) Tempo
    uid: canardstack-sqlite-tempo
    type: tempo
    access: proxy
    url: http://host.containers.internal:19093
    jsonData: {httpHeaderName1: Authorization}
    secureJsonData: {httpHeaderValue1: "Bearer dev-canardstack-key"}
