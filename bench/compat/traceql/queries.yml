# TraceQL queries chosen for the generated dataset (checkout traces across frontend, checkout and
# payment; typed span attributes; errors, events and links). Tempo's own valid example queries are
# added by the runner.
queries:
  # span filters and intrinsics
  - '{ }'
  - '{ true }'
  - '{ false }'
  - '{ name = "payment.charge" }'
  - '{ name != "payment.charge" }'
  - '{ name =~ "SELECT.*" }'
  - '{ name !~ "SELECT.*|INSERT.*" }'
  - '{ resource.service.name = "payment" }'
  - '{ resource.service.name != "frontend" }'
  - '{ resource.service.name =~ "front.*|pay.*" }'
  - '{ .service.name = "checkout" }'
  - '{ resource.deployment.environment = "test" }'
  - '{ duration > 100ms }'
  - '{ duration < 10ms }'
  - '{ duration >= 1s }'
  - '{ span:duration > 200ms && span:duration < 600ms }'
  - '{ status = error }'
  - '{ status != error }'
  - '{ status = ok }'
  - '{ span:status = unset }'
  - '{ statusMessage = "card declined" }'
  - '{ kind = server }'
  - '{ kind = client }'
  - '{ kind = internal }'
  - '{ span:kind != server }'
  - '{ rootName = "GET /api/orders" }'
  - '{ rootServiceName = "frontend" }'
  - '{ traceDuration > 500ms }'
  - '{ traceDuration < 200ms }'
  - '{ trace:rootName =~ "POST.*" }'
  - '{ span:id != "" }'
  - '{ span:parentID = "" }'
  - '{ childCount > 1 }'
  # attributes of every type
  - '{ span.http.method = "GET" }'
  - '{ .http.method = "POST" }'
  - '{ .http.method != "GET" }'
  - '{ .http.method =~ "P.*" }'
  - '{ .http.status_code = 200 }'
  - '{ .http.status_code >= 500 }'
  - '{ .http.status_code < 300 }'
  - '{ span.cache.hit = true }'
  - '{ .cache.hit = false }'
  - '{ .order.total > 100.5 }'
  - '{ .amount < 100 }'
  - '{ .order.items >= 5 }'
  - '{ .retry.count > 0 }'
  - '{ .user.id = "u1" }'
  - '{ .db.system = "postgresql" }'
  - '{ .db.statement =~ ".*orders.*" }'
  - '{ .payment.provider = "stripe" }'
  - '{ .nonexistent = "x" }'
  - '{ .http.method != nil }'
  - '{ .http.method = nil }'
  - '{ .http.status_code != nil && .http.status_code > 400 }'
  # events, links, instrumentation scope
  - '{ event:name = "exception" }'
  - '{ event.exception.type = "CardDeclined" }'
  - '{ event.exception.message =~ ".*funds.*" }'
  - '{ instrumentation:name = "compat" }'
  - '{ instrumentation:version = "1.0" }'
  - '{ link:spanID != nil }'
  # arithmetic and logic
  - '{ .http.status_code + 1 = 201 }'
  - '{ .order.items * 2 > 10 }'
  - '{ .http.status_code - 100 >= 400 }'
  - '{ duration / 2 > 100ms }'
  - '{ status = error || .http.status_code = 404 }'
  - '{ !(.http.status_code = 200) }'
  - '{ .http.method = "GET" && (.http.status_code = 200 || .http.status_code = 201) }'
  - '{ -.retry.count < 0 }'
  # spanset operators
  - '{ resource.service.name = "frontend" } && { resource.service.name = "payment" }'
  - '{ name = "payment.charge" } || { name = "SELECT orders" }'
  - '{ resource.service.name = "frontend" } > { resource.service.name = "checkout" }'
  - '{ resource.service.name = "frontend" } >> { name = "payment.charge" }'
  - '{ name = "payment.charge" } < { name = "ProcessOrder" }'
  - '{ name = "payment.charge" } << { name = "GET /api/orders" }'
  - '{ name = "SELECT orders" } ~ { name = "INSERT audit" }'
  - '{ name = "SELECT orders" } ~ { name = "payment.charge" }'
  - '{ name = "ProcessOrder" } !> { name = "payment.charge" }'
  - '{ name = "ProcessOrder" } &> { name = "payment.charge" }'
  - '{ kind = server } &>> { .db.system = "postgresql" }'
  - '{ name = "checkout.process" } !>> { name = "payment.charge" }'
  # pipelines, aggregates, grouping
  - '{ } | count() > 3'
  - '{ } | count() = 6'
  - '{ .http.method = "GET" } | count() >= 1'
  - '{ resource.service.name = "checkout" } | count() > 2'
  - '{ } | avg(duration) > 100ms'
  - '{ } | max(duration) > 500ms'
  - '{ } | min(duration) < 5ms'
  - '{ } | sum(duration) > 1s'
  - '{ } | max(.http.status_code) = 500'
  - '{ } | avg(.order.total) > 100'
  - 'avg(duration) > 100ms'
  - 'count() > 4'
  - '{ } | by(resource.service.name) | count() > 1'
  - '{ } | by(.http.method) | count() > 2'
  - '{ status = error } | coalesce()'
  - '{ } | by(resource.service.name) | coalesce() | count() > 4'
  - '{ status = error } | select(.http.method, duration)'
  - '{ } | count() > 3 | { status = error }'
  - '{ .http.method = "GET" } | { status = error }'
