[package]
name = "canardstack"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Single-binary OpenTelemetry query server backed by DuckLake"
repository = "https://github.com/smithclay/canardstack"
homepage = "https://smithclay.github.io/canardstack/"
readme = "README.md"
keywords = ["observability", "opentelemetry", "otlp", "duckdb", "ducklake"]
categories = ["command-line-utilities", "development-tools::debugging", "database"]
include = [
    "/canardstack.png",
    "/Cargo.lock",
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/src",
    "/tests",
]

[dependencies]
anyhow = "1.0.102"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "signal", "macros", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-io-timeout = "1.2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
chrono = { version = "0.4.44", features = ["clock"] }
duckdb = { version = "=1.10506.1" }
otlp2records = "0.8.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml_edit = { version = "0.25.11", default-features = false, features = ["parse"] }
tracing = "0.1.44"
url = "2.5"
rustls-pemfile = { version = "2", optional = true }
# Optional: only pulled in for the `tls` feature (in-binary TLS shims).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rcgen = { version = "0.13", default-features = false, features = ["ring"], optional = true }
logql-syntax = { version = "0.1.0", path = "crates/logql-syntax" }
promql-parser = "0.11.1"
regex = "1.13.1"

[workspace]
members = [".", "crates/logql-syntax", "crates/traceql-syntax"]
resolver = "2"

[features]
default = ["bundled"]
# Compile DuckDB from source into the binary (a slow, cold C++ build, but self-contained). Turn off
# with `--no-default-features` to link a prebuilt libduckdb of the same version instead:
# set DUCKDB_LIB_DIR to a directory holding libduckdb and duckdb.h (the Dockerfile does this).
bundled = ["duckdb/bundled"]
detailed-metrics = []
# In-binary TLS termination for `serve` (rustls + PEM cert/key
# files, with an explicit ephemeral self-signed mode). Off by default to keep the
# lean build.
tls = ["dep:rustls-pemfile", "dep:rustls", "dep:rcgen", "dep:tokio-rustls"]

[[bench]]
name = "query_engine"
harness = false

[dev-dependencies]
tempfile = "3.27.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.dev.package.libduckdb-sys]
debug = false
